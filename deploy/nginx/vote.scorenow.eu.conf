# vote.scorenow.eu: öffentliches Publikums- und Jury-Voting.
# Nur die Seiten aus public/ und eine feste Liste von API-Routen sind erreichbar.
# Regie, Beamer, Admin-API und NodeCG-Socket gibt es hier nicht (404).
# TLS ergänzt `certbot --nginx -d vote.scorenow.eu`, sobald DNS auf den Server zeigt.
server {
    listen 80;
    listen [::]:80;
    server_name vote.scorenow.eu;

    client_max_body_size 64k;

    # Öffentliche API-Routen (Freigabeliste)
    location ~ ^/pv-digivote/api/(bootstrap|sessions/public|sessions/jury|ballots|ballots/me|health)$ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Alles andere unter der API (insbesondere /admin/*) bleibt gesperrt.
    location /pv-digivote/api/ {
        return 404;
    }

    # Kurze Adressen: vote.scorenow.eu und vote.scorenow.eu/jury
    location = / {
        proxy_pass http://127.0.0.1:9090/bundles/pv-digivote/app/vote.html;
        proxy_set_header Host $host;
    }
    location = /jury {
        return 302 /jury.html;
    }

    # vote.html, jury.html und ihre Assets aus dem NodeCG-Mount "app" (Ordner public/).
    location / {
        proxy_pass http://127.0.0.1:9090/bundles/pv-digivote/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
