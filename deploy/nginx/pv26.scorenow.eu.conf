# pv26.scorenow.eu: Regie, Beamer A/B, Moderator-Tablet (NodeCG komplett), mit Passwort.
# Ausnahme: der eigene Bridge-Pfad für ShowTC, dort schützt das BRIDGE_TOKEN.
# Passwortdatei: /etc/nginx/pv26.htpasswd (htpasswd -B /etc/nginx/pv26.htpasswd regie)
# Braucht die Map $connection_upgrade (in /etc/nginx/sites-available/rescueop definiert).
# TLS ergänzt `certbot --nginx -d pv26.scorenow.eu`, sobald DNS auf den Server zeigt.
server {
    listen 80;
    listen [::]:80;
    server_name pv26.scorenow.eu;

    client_max_body_size 4m;

    auth_basic "PastVision Regie";
    auth_basic_user_file /etc/nginx/pv26.htpasswd;

    # ShowTC: wss://pv26.scorenow.eu/pv-digivote-bridge/socket.io/ (in ShowTC als
    # Adresse https://pv26.scorenow.eu/pv-digivote-bridge eintragen). Dieser Socket trägt
    # nur den Bridge-Namespace mit Token-Prüfung, nicht die NodeCG-Regie.
    location /pv-digivote-bridge/socket.io/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = / {
        return 302 /dashboard/#fullbleed/controller;
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
